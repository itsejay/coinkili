<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinKili 🇹🇿 | Tanzania's Crypto Tracker</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- THEME CONFIG --- */
        :root {
            --bg-color: #ffffff;
            --surface-color: #ffffff;
            --text-primary: #000000;
            --text-secondary: #58667e;
            --border-color: #eff2f5;
            --accent-color: #3861fb;
            --up-color: #16c784;
            --down-color: #ea3943;
            --sticky-bg: #ffffff; /* Crucial for sticky column */
            --shadow-color: rgba(0,0,0,0.05);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0d1421;
                --surface-color: #171924;
                --text-primary: #ffffff;
                --text-secondary: #a1a7bb;
                --border-color: #222531;
                --sticky-bg: #0d1421;
                --shadow-color: rgba(0,0,0,0.4);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); }

        /* --- LAYOUT --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }

        /* HEADER */
        header {
            position: sticky; top: 0; z-index: 1000;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
        }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; font-size: 1.4rem; color: var(--text-primary); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--accent-color); }

        /* SEARCH BAR (New) */
        .search-container {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
        }
        .search-input:focus { border-color: var(--accent-color); }

        /* --- ADVANCED TABLE STYLES --- */
        .table-wrapper {
            overflow-x: auto; /* Enables Horizontal Scroll */
            border-radius: 12px;
            box-shadow: 0 4px 24px var(--shadow-color);
            border: 1px solid var(--border-color);
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: separate; /* Required for sticky */
            border-spacing: 0;
            white-space: nowrap;
        }

        th {
            background: var(--bg-color);
            color: var(--text-secondary);
            font-size: 0.8rem;
            padding: 15px;
            text-align: right; /* Default align numbers right */
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            text-align: right;
            font-weight: 500;
            font-size: 0.95rem;
        }

        /* STICKY COLUMNS CONFIGURATION */
        /* Column 1: Rank (#) */
        th:nth-child(1), td:nth-child(1) {
            position: sticky;
            left: 0;
            background: var(--sticky-bg);
            z-index: 10;
            text-align: center;
            width: 50px;
            border-right: 1px solid var(--border-color);
        }

        /* Column 2: Coin Name */
        th:nth-child(2), td:nth-child(2) {
            position: sticky;
            left: 50px; /* Push it after the Rank column */
            background: var(--sticky-bg);
            z-index: 10;
            text-align: left;
            min-width: 160px;
            box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1); /* Subtle shadow separator */
        }
        
        /* Ensure headers stay on top of sticky columns when scrolling down */
        thead th:nth-child(1), thead th:nth-child(2) {
            z-index: 30; 
        }

        .coin-flex { display: flex; align-items: center; gap: 10px; }
        .coin-icon { width: 24px; height: 24px; border-radius: 50%; }
        .coin-symbol { color: var(--text-secondary); font-size: 0.8rem; margin-left: 5px; }

        .up { color: var(--up-color); }
        .down { color: var(--down-color); }
        
        /* Sparkline Chart SVG */
        .sparkline { width: 100px; height: 35px; }
        path { fill: none; stroke-width: 2; stroke-linecap: round; }

        /* --- FOOTER --- */
        footer { padding: 40px 0; text-align: center; color: var(--text-secondary); font-size: 0.85rem; border-top: 1px solid var(--border-color); margin-top: 40px;}

    </style>
</head>
<body>

    <header>
        <div class="container nav-flex">
            <a href="#" class="logo">
                <i class="fa-solid fa-coins" style="color: #F7931A;"></i> 
                Coin<span>Kili</span>
            </a>
            <i class="fas fa-moon" style="color: var(--text-secondary);"></i>
        </div>
    </header>

    <div class="container">
        
        <div style="margin: 30px 0;">
            <h2 style="font-size: 1.5rem; margin-bottom: 5px;">Today's Prices in TZS</h2>
            <p style="color: var(--text-secondary);">Top coins by market cap</p>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="Search coins (e.g. Bitcoin, Ethereum)...">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Coin</th>
                        <th>Price (TZS)</th>
                        <th>24h %</th>
                        <th>7d Chart</th>
                        <th>Mkt Cap</th>
                    </tr>
                </thead>
                <tbody id="crypto-table">
                    </tbody>
            </table>
            <div id="loader" style="text-align: center; padding: 20px; color: var(--text-secondary);">
                <i class="fas fa-circle-notch fa-spin"></i> Loading Market Data...
            </div>
        </div>

    </div>

    <footer>
        <p>Built for Tanzania 🇹🇿 | Data by CoinGecko</p>
    </footer>

    <script>
        // Use 'sparkline=true' to get the 7-day data
        const API_URL = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=tzs&order=market_cap_desc&per_page=50&page=1&sparkline=true&price_change_percentage=24h';
        
        let allCoins = []; // Store data for searching

        // Formatting Helpers
        const formatTZS = (num) => new Intl.NumberFormat('en-TZ', { style: 'currency', currency: 'TZS', maximumFractionDigits: 0 }).format(num);
        const formatCompact = (num) => new Intl.NumberFormat('en-US', { notation: "compact", compactDisplay: "short" }).format(num);

        // --- SPARKLINE GENERATOR (The "Pro" feature) ---
        // Converts array of prices into an SVG path string
        function createSparkline(data, isUp) {
            const width = 100; 
            const height = 35;
            const min = Math.min(...data);
            const max = Math.max(...data);
            const range = max - min;
            
            // Map points to SVG coordinates
            const points = data.map((price, index) => {
                const x = (index / (data.length - 1)) * width;
                const y = height - ((price - min) / range) * height; // Invert Y because SVG 0 is top
                return `${x},${y}`;
            }).join(' ');

            const color = isUp ? '#16c784' : '#ea3943';
            return `<svg class="sparkline"><path d="M ${points}" stroke="${color}" /></svg>`;
        }

        async function init() {
            try {
                const res = await fetch(API_URL);
                allCoins = await res.json();
                renderTable(allCoins);
                document.getElementById('loader').style.display = 'none';
            } catch (err) {
                console.error(err);
            }
        }

        function renderTable(coins) {
            const tbody = document.getElementById('crypto-table');
            tbody.innerHTML = ''; // Clear current

            coins.forEach(coin => {
                const tr = document.createElement('tr');
                const isUp = coin.price_change_percentage_24h >= 0;
                
                // Generate the mini chart
                const chartSvg = createSparkline(coin.sparkline_in_7d.price, isUp);

                tr.innerHTML = `
                    <td>${coin.market_cap_rank}</td>
                    <td>
                        <div class="coin-flex">
                            <img src="${coin.image}" class="coin-icon" alt="">
                            <div>
                                <span>${coin.name}</span>
                                <span class="coin-symbol">${coin.symbol.toUpperCase()}</span>
                            </div>
                        </div>
                    </td>
                    <td>${formatTZS(coin.current_price)}</td>
                    <td class="${isUp ? 'up' : 'down'}">
                        <i class="fas fa-caret-${isUp ? 'up' : 'down'}"></i>
                        ${Math.abs(coin.price_change_percentage_24h).toFixed(2)}%
                    </td>
                    <td>${chartSvg}</td>
                    <td style="color: var(--text-secondary)">${formatCompact(coin.market_cap)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Search Logic
        document.getElementById('search-input').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allCoins.filter(coin => 
                coin.name.toLowerCase().includes(term) || 
                coin.symbol.toLowerCase().includes(term)
            );
            renderTable(filtered);
        });

        init();
    </script>
</body>
</html>

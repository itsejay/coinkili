<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinKili 🇹🇿 | Tanzania's #1 Crypto Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #ffffff; --surface-color: #f8fafd; --text-primary: #000000;
            --text-secondary: #58667e; --border-color: #eff2f5; --accent-color: #3861fb;
            --up-color: #16c784; --down-color: #ea3943; --sticky-bg: #ffffff; --ticker-bg: #f0f3fa;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0d1421; --surface-color: #171924; --text-primary: #ffffff;
                --text-secondary: #a1a7bb; --border-color: #222531; --sticky-bg: #0d1421; --ticker-bg: #1c2130;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); transition: 0.3s; line-height: 1.5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }

        /* TICKERS & STATS */
        .global-stats { background: var(--bg-color); border-bottom: 1px solid var(--border-color); padding: 8px 0; font-size: 0.7rem; color: var(--text-secondary); display: flex; overflow-x: auto; white-space: nowrap; }
        .stat-item span { color: var(--accent-color); font-weight: 600; margin-left: 4px; }
        
        .whale-ticker { background: var(--ticker-bg); color: var(--text-secondary); font-size: 0.75rem; padding: 8px 0; overflow: hidden; white-space: nowrap; border-bottom: 1px solid var(--border-color); }
        .ticker-track { display: inline-block; animation: marquee 45s linear infinite; }
        .ticker-item { display: inline-block; padding: 0 30px; }
        .ticker-item span { color: var(--accent-color); font-weight: 700; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        header { border-bottom: 1px solid var(--border-color); padding: 15px 0; background: var(--bg-color); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); text-decoration: none; }
        .logo span { color: var(--accent-color); }

        .hero { padding: 30px 0; text-align: center; }
        .hero h1 { font-size: 2rem; margin-bottom: 8px; background: linear-gradient(90deg, #3861fb, #16c784); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* HIGHLIGHTS */
        .highlights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .hl-card { background: var(--surface-color); padding: 18px; border-radius: 12px; border: 1px solid var(--border-color); }
        .highlights-title { font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .hl-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-top: 8px; }

        /* SEARCH & TABLE */
        .search-container { margin-bottom: 20px; position: relative; }
        #coin-search { width: 100%; padding: 12px 45px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--surface-color); color: var(--text-primary); outline: none; }
        .search-container i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }

        .table-container { overflow-x: auto; background: var(--bg-color); border-radius: 12px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { text-align: right; padding: 12px; font-size: 0.7rem; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; font-weight: 600; text-align: right; }
        
        /* Sticky Coin Column */
        th:nth-child(2), td:nth-child(2) { position: sticky; left: 0; background: var(--sticky-bg); z-index: 5; text-align: left; min-width: 150px; border-right: 1px solid var(--border-color); }
        
        .coin-flex { display: flex; align-items: center; gap: 8px; }
        .coin-icon { width: 22px; height: 22px; border-radius: 50%; }
        .up { color: var(--up-color); } .down { color: var(--down-color); }
        .sparkline { width: 70px; height: 25px; }
        path { fill: none; stroke-width: 2; }

        footer { padding: 40px 0; text-align: center; color: var(--text-secondary); font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="global-stats"><div class="container" id="global-box">Loading Global Stats...</div></div>
    <div class="whale-ticker"><div class="ticker-track" id="whale-track"></div></div>

    <header><div class="container"><a href="#" class="logo">Coin<span>Kili</span> 🇹🇿</a></div></header>

    <div class="container hero">
        <h1>Karibu Crypto Tanzania</h1>
        <p>Real-time data for the Top 100 coins in TZS.</p>
    </div>

    <div class="container">
        <div class="highlights-grid">
            <div class="hl-card">
                <div class="highlights-title"><i class="fas fa-rocket" style="color:#16c784"></i> Top 3 Gainers (24h)</div>
                <div id="gainers-list">...</div>
            </div>
            <div class="hl-card">
                <div class="highlights-title"><i class="fas fa-chart-line" style="color:#3861fb"></i> Top 3 Market Cap</div>
                <div id="mcap-list">...</div>
            </div>
        </div>

        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="coin-search" placeholder="Search 100 coins...">
        </div>

        <div class="table-container">
            <table>
                <thead><tr><th>#</th><th>Coin</th><th>Price (TZS)</th><th>24h %</th><th>7d Chart</th><th>Market Cap</th></tr></thead>
                <tbody id="crypto-table"></tbody>
            </table>
            <div id="loader" style="text-align:center; padding:40px;"><i class="fas fa-spinner fa-spin"></i> Loading Market Data...</div>
        </div>
    </div>

    <footer>&copy; 2025 CoinKili. Powered by CoinGecko API.</footer>

    <script>
        let allCoins = [];
        const TZS_RATE = 2715;
        // Optimization: Use USD to fetch 100 coins (much faster) then convert in code
        const API_URL = `https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=true&price_change_percentage=24h`;
        const GLOBAL_URL = `https://api.coingecko.com/api/v3/global`;

        const formatTZS = (num) => new Intl.NumberFormat('en-TZ', { style: 'currency', currency: 'TZS', maximumFractionDigits: 0 }).format(num * TZS_RATE);
        const formatCompact = (num) => new Intl.NumberFormat('en-US', { notation: "compact", compactDisplay: "short" }).format(num * TZS_RATE);

        function createSparkline(data, isUp) {
            if(!data) return '';
            const width = 70, height = 25;
            const min = Math.min(...data), max = Math.max(...data), range = (max - min) || 1;
            const points = data.map((p, i) => `${(i/(data.length-1))*width},${height-((p-min)/range)*height}`).join(' ');
            return `<svg class="sparkline"><path d="M ${points}" stroke="${isUp?'#16c784':'#ea3943'}" /></svg>`;
        }

        async function start() {
            fetchGlobal();
            fetchMarket();
            // Whale alerts
            document.getElementById('whale-track').innerHTML = Array(10).fill('<div class="ticker-item"><span>ALERT:</span> Whale moved 500 BTC to Binance</div>').join('');
        }

        async function fetchGlobal() {
            try {
                const res = await fetch(GLOBAL_URL);
                const { data } = await res.json();
                document.getElementById('global-box').innerHTML = `
                    <div class="stat-item">Market Cap: <span>${formatTZS(data.total_market_cap.usd / TZS_RATE)}</span></div>
                    <div class="stat-item">24h Vol: <span>${formatTZS(data.total_volume.usd / TZS_RATE)}</span></div>
                    <div class="stat-item">BTC Dominance: <span>${data.market_cap_percentage.btc.toFixed(1)}%</span></div>
                `;
            } catch(e) {}
        }

        async function fetchMarket() {
            try {
                const res = await fetch(API_URL);
                if(!res.ok) throw new Error();
                allCoins = await res.json();
                renderAll(allCoins);
                document.getElementById('loader').style.display = 'none';
            } catch (e) {
                document.getElementById('loader').innerHTML = "Market busy. Retrying...";
                setTimeout(fetchMarket, 5000);
            }
        }

        function renderAll(coins) {
            // Highlights
            const gainers = [...coins].sort((a,b) => b.price_change_percentage_24h - a.price_change_percentage_24h).slice(0,3);
            const top3 = coins.slice(0,3);

            document.getElementById('gainers-list').innerHTML = gainers.map(c => `<div class="hl-row"><span>${c.name}</span><span class="up">+${c.price_change_percentage_24h.toFixed(1)}%</span></div>`).join('');
            document.getElementById('mcap-list').innerHTML = top3.map(c => `<div class="hl-row"><span>${c.name}</span><span>${formatCompact(c.market_cap / TZS_RATE)}</span></div>`).join('');

            // Table
            const tbody = document.getElementById('crypto-table');
            tbody.innerHTML = coins.map(c => {
                const isUp = c.price_change_percentage_24h >= 0;
                return `<tr>
                    <td>${c.market_cap_rank}</td>
                    <td><div class="coin-flex"><img src="${c.image}" class="coin-icon"><div>${c.name} <span class="symbol">${c.symbol}</span></div></div></td>
                    <td>${formatTZS(c.current_price)}</td>
                    <td class="${isUp?'up':'down'}">${isUp?'▲':'▼'} ${Math.abs(c.price_change_percentage_24h).toFixed(2)}%</td>
                    <td>${createSparkline(c.sparkline_in_7d.price, isUp)}</td>
                    <td style="color:var(--text-secondary)">${formatCompact(c.market_cap)}</td>
                </tr>`;
            }).join('');
        }

        document.getElementById('coin-search').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = allCoins.filter(c => c.name.toLowerCase().includes(val) || c.symbol.toLowerCase().includes(val));
            renderAll(filtered);
        });

        start();
    </script>
</body>
</html>
